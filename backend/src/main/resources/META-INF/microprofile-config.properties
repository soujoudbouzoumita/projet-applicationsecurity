# ---------------------------------------------------------------------------------
# SecureTeam Access - MicroProfile Config
# ---------------------------------------------------------------------------------
# SECURITY NOTE:
#   - Do NOT hardcode secrets in this file.
#   - Use environment variables (12-factor app).
#
# In development, docker-compose.dev.yml sets these env vars.

# Steganography / master password (used by EncryptionService)
com.secureteam.steganography.master-password=${SECRET_MASTER_PASSWORD}

# Crypto salt/pepper for key derivation
com.secureteam.encryption.salt=${SECRET_ENCRYPTION_SALT}
com.secureteam.encryption.pepper=${SECRET_ENCRYPTION_PEPPER}

# Optional: CORS allowed origin (used by CorsFilter if implemented)
secureteam.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
