version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: secureteam-postgres
    environment:
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: secure_password_123!
      POSTGRES_DB: secureteam_access_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secureteam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: secureteam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - secureteam-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  secureteam-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
